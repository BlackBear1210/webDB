<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>FitQR</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
  <div class="phone">
    {% block header %}
    <header class="topbar">
      <div class="topbar-title">{% block title %}FitQR{% endblock %}</div>
      {% block topright %}{% endblock %}
    </header>
    {% endblock %}

    <main class="content">
      {% block content %}{% endblock %}
    </main>

    {% if show_nav is not defined or show_nav %}
    <nav class="tabbar">
      <a href="/" class="tab {{ 'on' if active=='routine' }}">
        <span class="ti">🏋️</span><span>루틴</span></a>
      <a href="/custom/" class="tab {{ 'on' if active=='custom' }}">
        <span class="ti">✏️</span><span>커스텀</span></a>
      <a href="/exercises/" class="tab {{ 'on' if active=='exercises' }}">
        <span class="ti">📋</span><span>운동</span></a>
      <a href="/report/" class="tab {{ 'on' if active=='report' }}">
        <span class="ti">📊</span><span>리포트</span></a>
      <a href="/me/" class="tab {{ 'on' if active=='me' }}">
        <span class="ti">👤</span><span>내 정보</span></a>
    </nav>
    {% endif %}
  </div>

  <!-- CSRF: 페이지의 모든 POST 폼에 토큰을 자동으로 숨은 필드로 주입 -->
  <script>
  (function () {
    var CSRF = "{{ csrf_token() }}";
    function addToken(f) {
      if (!f || (f.method || '').toLowerCase() !== 'post') return;
      if (f.querySelector('input[name="_csrf"]')) return;
      var i = document.createElement('input');
      i.type = 'hidden'; i.name = '_csrf'; i.value = CSRF;
      f.appendChild(i);
    }
    document.addEventListener('DOMContentLoaded', function () {
      document.querySelectorAll('form').forEach(addToken);
    });
  })();
  </script>
</body>
</html>
