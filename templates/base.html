<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FitQR{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    <!-- 갤럭시 S25 폰 프레임 -->
    <div class="phone-frame">
        <!-- 펀치홀 카메라 -->
        <div class="punch-hole"></div>

        <div class="phone-screen">
            <!-- 상태바 (One UI 스타일) -->
            <div class="status-bar">
                <span class="sb-time" id="clock">9:41</span>
                <span class="sb-icons">
                    <span class="sb-net">5G</span>
                    <span class="sb-signal">📶</span>
                    <span class="sb-batt">82%</span>
                    <span class="batt-box"><span class="batt-fill"></span></span>
                </span>
            </div>

            <!-- 앱 본문 (스크롤 영역) -->
            <div class="app-body">
                {% block content %}{% endblock %}
            </div>

            <!-- 하단 탭바 (로그인 시에만) -->
            {% if session['user_id'] %}
            <nav class="tabbar">
                <a href="/" class="tab {% if request.path == '/' %}active{% endif %}">
                    <span class="tab-ico">🏠</span><span class="tab-lbl">홈</span>
                </a>
                <a href="/machines/" class="tab {% if '/machine' in request.path or '/workout' in request.path %}active{% endif %}">
                    <span class="tab-ico">💪</span><span class="tab-lbl">운동</span>
                </a>
                <a href="/history/" class="tab {% if '/history' in request.path %}active{% endif %}">
                    <span class="tab-ico">📊</span><span class="tab-lbl">기록</span>
                </a>
                <a href="/recommend/" class="tab {% if '/recommend' in request.path %}active{% endif %}">
                    <span class="tab-ico">🥗</span><span class="tab-lbl">추천</span>
                </a>
                <a href="/profile/" class="tab {% if '/profile' in request.path %}active{% endif %}">
                    <span class="tab-ico">👤</span><span class="tab-lbl">내정보</span>
                </a>
            </nav>
            {% endif %}
        </div>
    </div>

    <!-- 상태바 시계 (실시간) -->
    <script>
        function fitqrTick(){
            const d = new Date();
            const h = d.getHours();
            const m = String(d.getMinutes()).padStart(2, '0');
            const el = document.getElementById('clock');
            if (el) el.innerText = h + ':' + m;
        }
        fitqrTick();
        setInterval(fitqrTick, 1000);
    </script>
    {% block script %}{% endblock %}
</body>
</html>
