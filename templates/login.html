{% extends 'base.html' %}
{% block title %}FitQR - 로그인{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-logo">
        <div class="emoji">🏋️</div>
        <h1>FitQR</h1>
        <p class="subtitle">스마트 짐 운동 트래커</p>
    </div>

    {% if error %}
        <p class="msg-error">{{ error }}</p>
    {% endif %}

    <form method="post">
        <label>아이디</label>
        <input type="text" name="login_id" id="login_id" placeholder="아이디 입력">

        <label>비밀번호</label>
        <input type="password" name="password" id="password" placeholder="비밀번호 입력">

        <input type="button" value="로그인" class="btn btn-block" onclick="
            if(document.getElementById('login_id').value==''
            || document.getElementById('password').value==''){
                alert('아이디와 비밀번호를 입력해주세요.');
            } else {
                document.querySelector('form').submit();
            }
        ">
    </form>

    <p class="center-link">
        계정이 없나요? <a href="/register/">회원가입</a>
    </p>
</div>
{% endblock %}
