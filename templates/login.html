{% extends "base.html" %}
{% set show_nav = False %}
{% block header %}{% endblock %}
{% block content %}
<div class="auth">
  <h1>FitQR</h1>
  <div class="tagline">QR 찍고 — 운동을 기록하다</div>

  {% if error %}<div class="error">{{ error }}</div>{% endif %}

  <form method="post">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label class="fl">아이디</label>
    <input name="login_id" placeholder="아이디" autocomplete="username">
    <label class="fl">비밀번호</label>
    <input name="password" type="password" placeholder="비밀번호" autocomplete="current-password">
    <button class="btn mt" type="submit">로그인</button>
  </form>

  <a href="/register/"><button class="btn ghost mt">회원가입</button></a>
  <p class="muted small center mt">관리자 데모 계정 · admin / 1234</p>
</div>
{% endblock %}
