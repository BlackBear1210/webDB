{% extends "base.html" %}
{% block title %}정보 수정{% endblock %}
{% block topright %}<a href="/me/" class="link">← 내 정보</a>{% endblock %}
{% block content %}
<form method="post" action="/me/edit/">
  <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
  <label class="fl" style="margin-top:0">이름</label>
  <input name="name" value="{{ u[3] }}">

  <label class="fl">성별</label>
  <select name="gender">
    <option value="남"{{ ' selected' if u[4]=='남' }}>남</option>
    <option value="여"{{ ' selected' if u[4]=='여' }}>여</option>
  </select>

  <label class="fl">주된 목표</label>
  <select name="goal">
    {% for g in goals %}<option value="{{ g }}"{{ ' selected' if u[5]==g }}>{{ g }}</option>{% endfor %}
  </select>

  <label class="fl">집중 부위 (복수 선택 가능)</label>
  {% set cur_focus = (u[6] or '').split(',') %}
  <div class="chips">
    {% for b in body_parts %}
    <label class="chip {{ 'on' if b in cur_focus }}">
      <input type="checkbox" name="focus_part" value="{{ b }}" hidden {{ 'checked' if b in cur_focus }}
             onchange="this.closest('.chip').classList.toggle('on', this.checked)">
      {{ b }}
    </label>
    {% endfor %}
  </div>

  <label class="fl">키 (cm)</label>
  <input name="height" type="number" step="0.1" value="{{ u[7] }}">
  <label class="fl">현재 체중 (kg)</label>
  <input name="weight" type="number" step="0.1" value="{{ u[8] }}">
  <label class="fl">목표 체중 (kg)</label>
  <input name="target_weight" type="number" step="0.1" value="{{ u[9] }}">

  <label class="fl">피트니스 레벨</label>
  <select name="fitness_level">
    {% for l in levels %}<option value="{{ l }}"{{ ' selected' if u[10]==l }}>{{ l }}</option>{% endfor %}
  </select>

  <label class="fl">1RM — 스쿼트 / 벤치 / 데드 (kg)</label>
  <div class="row">
    <input name="squat_1rm" type="number" step="0.5" value="{{ u[11] }}">
    <input name="bench_1rm" type="number" step="0.5" value="{{ u[12] }}">
    <input name="deadlift_1rm" type="number" step="0.5" value="{{ u[13] }}">
  </div>

  <label class="fl">운동 빈도 (주당)</label>
  <select name="frequency">
    {% for n in [1,2,3,4,5,6,7] %}
    <option value="{{ n }}"{{ ' selected' if u[14]==n }}>{{ '매일' if n==7 else (n ~ '일 / 주') }}</option>
    {% endfor %}
  </select>

  <label class="fl">운동 시작 요일</label>
  <select name="start_weekday">
    {% for i in range(7) %}<option value="{{ i }}"{{ ' selected' if u[15]==i }}>{{ weekdays[i] }}요일</option>{% endfor %}
  </select>

  <button class="btn mt" type="submit">저장</button>
  <p class="muted small center mt">※ 빈도·시작요일·레벨 변경은 다음 루틴 생성부터 반영됩니다.</p>
</form>
{% endblock %}
