<!doctype html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}FitQR 관리자{% endblock %}</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="admin">
    <!-- 상단바 -->
    <div class="admin-top">
        <div class="admin-logo">🏋️ FitQR 관리자 콘솔</div>
        <div>
            <b>{{ session['name'] }}</b> 관리자님
            <a href="/">📱 사용자 앱</a>
            <a href="/logout/">로그아웃</a>
        </div>
    </div>

    <!-- 메뉴 탭 -->
    <div class="admin-nav">
        <a href="/admin/"          class="{% if request.path == '/admin/' %}active{% endif %}">📊 통계</a>
        <a href="/admin/users/"    class="{% if '/admin/users' in request.path %}active{% endif %}">👥 회원관리</a>
        <a href="/admin/machines/" class="{% if '/admin/machine' in request.path %}active{% endif %}">🏋️ 기구관리</a>
        <a href="/admin/coupons/"  class="{% if '/admin/coupon' in request.path %}active{% endif %}">🎁 쿠폰관리</a>
    </div>

    <!-- 본문 -->
    <div class="admin-content">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
