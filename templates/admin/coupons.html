{% extends "base.html" %}
{% set show_nav = False %}
{% block title %}쿠폰 관리{% endblock %}
{% block topright %}<a href="/" class="link">앱으로 →</a>{% endblock %}
{% block content %}
<div class="adminbar">
  <a href="/admin/">대시보드</a>
  <a href="/admin/exercises/">운동종목</a>
  <a class="on" href="/admin/coupons/">쿠폰</a>
  <a href="/admin/users/">회원</a>
</div>

<div class="card">
  <div class="sec-title">쿠폰 추가</div>
  <form method="post" action="/admin/coupons/add/">
    <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
    <label class="fl" style="margin-top:0">제휴사</label>
    <input name="partner_name" required>
    <div class="row">
      <div class="grow"><label class="fl">분류</label>
        <select name="category"><option>프로틴</option><option>운동장비</option></select></div>
      <div class="grow"><label class="fl">재고</label>
        <input name="total_qty" type="number" value="50"></div>
    </div>
    <label class="fl">코드 / 할인</label>
    <input name="code" placeholder="FITQR-XXX">
    <input name="discount" placeholder="10% 할인" class="mt">
    <button class="btn mt" type="submit">추가</button>
  </form>
</div>

<div class="card">
  <div class="sec-title">쿠폰 목록</div>
  <table class="tb">
    <tr><th>제휴사</th><th>할인</th><th>재고</th><th>지급</th><th></th></tr>
    {% for c in coupons %}
    <tr>
      <td>{{ c[1] }}</td><td>{{ c[4] }}</td><td>{{ c[6] }}</td><td>{{ c[7] }}</td>
      <td><form method="post" action="/admin/coupons/{{ c[0] }}/delete/">
        <input type="hidden" name="_csrf" value="{{ csrf_token() }}">
        <button class="btn sm ghost" type="submit">삭제</button></form></td>
    </tr>
    {% endfor %}
  </table>
</div>
{% endblock %}
