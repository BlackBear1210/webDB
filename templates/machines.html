{% extends 'base.html' %}
{% block title %}FitQR - 기구 목록{% endblock %}

{% block content %}
<div class="app-header">
    <span><a href="/" class="h-back">←</a><span class="h-title">운동 기구</span></span>
</div>

<div class="page">
    <div class="card-tip">
        💡 기구의 <b>QR을 스캔</b>하면 해당 기구로 이동해요. 아래에서 직접 선택도 가능해요.
    </div>

    <a href="/scan/" class="btn btn-block" style="margin-bottom:16px;">📷 QR 스캔하기</a>

    <div class="menu-grid">
        {% for m in machines %}
        <a href="/machine/{{ m[0] }}/" class="feature">
            <div class="icon">🏋️</div>
            <div class="title">{{ m[1] }}</div>
            <div class="desc">{{ m[2] }}</div>
        </a>
        {% endfor %}
    </div>
</div>
{% endblock %}
