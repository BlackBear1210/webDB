{% extends 'base.html' %}
{% block title %}FitQR - 회원가입{% endblock %}

{% block content %}
<div class="auth-page">
    <div class="auth-logo">
        <div class="emoji">🏋️</div>
        <h1>FitQR</h1>
        <p class="subtitle">회원가입</p>
    </div>

    {% if error %}
        <p class="msg-error">{{ error }}</p>
    {% endif %}

    {% if success %}
        <p class="msg-success">{{ success }}</p>
        <a href="/login/" class="btn btn-block">로그인하러 가기</a>
    {% else %}
        <form method="post">
            <label>아이디</label>
            <input type="text" name="login_id" id="login_id" placeholder="아이디 입력">

            <label>비밀번호</label>
            <input type="password" name="password" id="password" placeholder="비밀번호 입력">

            <label>이름</label>
            <input type="text" name="name" id="name" placeholder="이름 입력">

            <div class="row2">
                <div>
                    <label>성별</label>
                    <select name="gender" id="gender">
                        <option value="남">남</option>
                        <option value="여">여</option>
                    </select>
                </div>
                <div>
                    <label>나이</label>
                    <input type="number" name="age" id="age" placeholder="나이">
                </div>
            </div>

            <div class="row2">
                <div>
                    <label>키 (cm)</label>
                    <input type="number" name="height" id="height" placeholder="175">
                </div>
                <div>
                    <label>몸무게 (kg)</label>
                    <input type="number" name="weight" id="weight" placeholder="70">
                </div>
            </div>

            <input type="button" value="가입하기" class="btn btn-block" onclick="
                if(document.getElementById('login_id').value==''
                || document.getElementById('password').value==''
                || document.getElementById('name').value==''){
                    alert('아이디 / 비밀번호 / 이름은 필수입니다.');
                } else {
                    document.querySelector('form').submit();
                }
            ">
        </form>

        <p class="center-link">
            이미 계정이 있나요? <a href="/login/">로그인</a>
        </p>
    {% endif %}
</div>
{% endblock %}
